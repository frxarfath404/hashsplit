  <circle cx="120" cy="60" r="240" fill="#5cc8ff" opacity="0.06"/>
  <circle cx="1180" cy="40" r="260" fill="#4de1c1" opacity="0.06"/>

  <!-- split / funnel icon: one stream in, two clean streams out -->
  <g transform="translate(90,110)" filter="url(#glow)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="26" y2="0"/>
    <path d="M26,-10 L46,0 L26,10 Z" fill="url(#accent)" stroke="none"/>
    <path d="M50,0 C64,0 64,-22 78,-22" />
    <path d="M50,0 C64,0 64,22 78,22" />
    <circle cx="78" cy="-22" r="6" fill="#4de1c1" stroke="none"/>
    <circle cx="78" cy="22" r="6" fill="#ff6ac1" stroke="none"/>
  </g>

  <text x="190" y="150" font-size="80" font-weight="700" fill="url(#title)" filter="url(#glow)" letter-spacing="2">HASHSPLIT</text>

  <text x="192" y="196" font-size="24" fill="#c4cdd9" letter-spacing="1">smart hash-dump splitter
    <tspan fill="#ff6ac1">  ·  users + hashes + cleartext, zero miss</tspan>
  </text>

  <text x="192" y="238" font-size="22" font-weight="700" letter-spacing="3">
    <tspan fill="#8492a4" font-weight="400">coded by  </tspan><tspan fill="#ff5f5f">f</tspan><tspan fill="#ffb454">r</tspan><tspan fill="#39ff9d">x</tspan><tspan> </tspan><tspan fill="#4de1c1">a</tspan><tspan fill="#5cc8ff">r</tspan><tspan fill="#ff6ac1">f</tspan><tspan fill="#ff5f5f">a</tspan><tspan fill="#ffb454">t</tspan><tspan fill="#39ff9d">h</tspan>
    <tspan fill="#3b5566" font-weight="400">    ·  github.com/frxarfath404</tspan>
  </text>

  <g transform="translate(150,268)">
    <rect x="0" y="0" width="980" height="172" rx="10" fill="#0c1017" stroke="#23303e"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f56"/><circle cx="40" cy="20" r="6" fill="#ffbd2e"/><circle cx="60" cy="20" r="6" fill="#27c93f"/>
    <text x="90" y="24" font-size="13" fill="#5b6a7d">hashsplit.py — hash-dump split summary</text>
    <text x="20" y="58" font-size="14" fill="#e6edf5"><tspan fill="#8492a4">$</tspan> hashsplit.py -i dump.txt <tspan fill="#ff6ac1">-o loot/</tspan></text>
    <text x="20" y="84" font-size="14"><tspan fill="#ff5f5f" font-weight="700">[!!!]</tspan><tspan fill="#ff9d9d"> CLEARTEXT PASSWORD(S) RECOVERED for: celia.almeda, cloudbase-init</tspan></text>
    <text x="20" y="106" font-size="14"><tspan fill="#ff5f5f" font-weight="700">[!!!]</tspan><tspan fill="#ff9d9d"> BLANK PASSWORD account(s): Guest, DefaultAccount</tspan></text>
    <text x="20" y="128" font-size="14"><tspan fill="#39ff9d" font-weight="700">[+]</tspan><tspan fill="#c4cdd9"> 9 unique user:hash pairs -&gt; dump_users.txt / dump_hashes.txt</tspan></text>
    <text x="20" y="150" font-size="14"><tspan fill="#5cc8ff" font-weight="700">[*]</tspan><tspan fill="#c4cdd9"> 2 cached domain hash(es) saved separately -&gt; dump_cached_hashes.txt</tspan></text>
  </g>

  <g font-size="12" font-weight="600">
    <g transform="translate(1132,266)">
      <rect x="-1" y="0"   width="132" height="20" rx="10" fill="#10261f" stroke="#1f5e4a"/><text x="14" y="14" fill="#4de1c1">NTLM HASH</text>
      <rect x="-1" y="22"  width="132" height="20" rx="10" fill="#241023" stroke="#5e1f4a"/><text x="20" y="36" fill="#ff6ac1">CLEARTEXT</text>
      <rect x="-1" y="44"  width="132" height="20" rx="10" fill="#0f1f2e" stroke="#1f5e7a"/><text x="18" y="58" fill="#5cc8ff">DCC2 CACHED</text>
      <rect x="-1" y="66"  width="132" height="20" rx="10" fill="#26210f" stroke="#5e4a1f"/><text x="14" y="80" fill="#ffb454">SMART DEDUPE</text>
      <rect x="-1" y="88"  width="132" height="20" rx="10" fill="#1a1030" stroke="#4a1f5e"/><text x="22" y="102" fill="#c48bff">ZERO MISS</text>
      <rect x="-1" y="110" width="132" height="20" rx="10" fill="#2a1608" stroke="#7a3f1f"/><text x="14" y="124" fill="#ff9d4d">PWDUMP</text>
